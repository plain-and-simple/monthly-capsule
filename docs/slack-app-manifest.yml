# Slack app manifest for optional capsule awards.
# Bot scopes only. No user scopes. No write scopes other than channels:join.
_metadata:
  major_version: 1
  minor_version: 1
display_information:
  name: Capsule Awards
  description: Reads public channel history to draft a monthly awards section.
features:
  bot_user:
    display_name: Capsule Awards
    always_online: false
oauth_config:
  scopes:
    bot:
      - channels:read
      - channels:history
      - channels:join
      - reactions:read
      - users:read
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
