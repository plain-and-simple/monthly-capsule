name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  e2e:
    name: E2E smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Local `next start` smoke only. Never production.
      # Do not map secrets.E2E_* here — repo secrets would leak to every PR
      # and hit capsule.plainandsimple.app. Production e2e lives in
      # .github/workflows/e2e-production.yml after Vercel Production is Ready.
      COOKIE_SECRET: e2e-ci-cookie-secret-value
      NEXT_PUBLIC_SUPABASE_URL: https://example.invalid
      NEXT_PUBLIC_SUPABASE_ANON_KEY: e2e-anon-key
      SUPABASE_SERVICE_ROLE_KEY: e2e-service-role-key
      CRON_SECRET: e2e-ci-cron-secret
      APP_URL: http://127.0.0.1:3000
      E2E_BASE_URL: ""
      E2E_EMAIL: ""
      E2E_PASSWORD: ""
      E2E_GROUP_PIN: ""
      E2E_GROUP_ID: ""
      E2E_CRON_SECRET: ""
      E2E_ALLOW_PRODUCTION: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
